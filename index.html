<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <link rel="stylesheet" href="discount.css">
</head>
<body>
    <div class="container">
        <h2> Discount Calculator</h2>

        <label for="basefare">Base Fare (up to 2 KM):</label>
        <input type="number" id="basefare" value="27" min="0">

        <h3>Enter Rate Per KM for Different Distance Slabs:</h3>
        <label for="rate1_5">1-5 KM:</label>
        <input type="number" id="rate1_5" value="0" min="0">

        <label for="rate6_10">6-10 KM:</label>
        <input type="number" id="rate6_10" value="0" min="0">

        <label for="rate11_15">11-15 KM:</label>
        <input type="number" id="rate11_15" value="0" min="0">

        <label for="rate16_20">16-20 KM:</label>
        <input type="number" id="rate16_20" value="0" min="0">

        <h3>Discount & GST:</h3>
        <label for="gst">GST %:</label>
        <input type="number" id="gst" value="5" min="0">

        <label for="discount">Discount %:</label>
        <input type="number" id="discount" value="50" min="0" max="100">

        <h3>Discount Capping Per Distance:</h3>
        <label for="cap1_5">1-5 KM Cap:</label>
        <input type="number" id="cap1_5" value="0" min="0">
        
        <label for="cap6_10">6-10 KM Cap:</label>
        <input type="number" id="cap6_10" value="0" min="0">

        <label for="cap11_15">11-15 KM Cap:</label>
        <input type="number" id="cap11_15" value="0" min="0">

        <label for="cap16_20">16-20 KM Cap:</label>
        <input type="number" id="cap16_20" value="0" min="0">

        <button onclick="calculateFare()">Calculate Fare Table</button>

        <h3>Fare Breakdown</h3>
        <table id="fareTable">
            <thead>
                <tr>
                    <th>Distance (KM)</th>
                    <th>Base Fare</th>
                    <th>Price Per KM</th>
                    <th>GST</th>
                    <th> 50% Discount</th>
                    <th>Cap Applied</th>
                    <th>Final Fare</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script src="discount.js"></script>
</body>
</html>
